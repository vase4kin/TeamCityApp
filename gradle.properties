# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Reuse task outputs between builds and run independent modules concurrently.
org.gradle.caching=true
org.gradle.parallel=true
KEYSTORE_FILE=KEYSTORE_FILE
KEYSTORE_PASSWORD=12345678
KEY_PASSWORD=12345678
KEY_ALIAS=KEY_ALIAS
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
# ButterKnife annotations still require compile-time constant resource IDs.
android.nonFinalResIds=false
# Optimized resource shrinking requires non-final IDs; enable after ButterKnife removal.
android.r8.optimizedResourceShrinking=false
android.enableAppCompileTimeRClass=false
android.uniquePackageNames=false
# Use AGP defaults: dependency constraints align app instrumentation tests only.
android.dependency.useConstraints=false
android.builtInKotlin=false
android.newDsl=false

# Compare checked-in Compose goldens during normal local unit tests.
# Roborazzi record tasks override verification when deliberately updating baselines.
roborazzi.test.verify=true
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
