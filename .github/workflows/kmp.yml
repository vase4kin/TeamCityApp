name: KMP iOS

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - name: Verify Apple Silicon and pinned Xcode
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Cache Kotlin Native distribution and dependencies
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Compile device and simulator frameworks and run shared tests
        run: |
          ./gradlew :shared-app:linkDebugFrameworkIosArm64 :shared-app:linkDebugFrameworkIosSimulatorArm64 :features:about:presentation:iosSimulatorArm64Test :libraries:design-system:iosSimulatorArm64Test --max-workers=2 --console=plain
      - name: Run About UI smoke tests
        run: |
          mkdir -p build/kmp-phase-1
          xcodebuild -project iosApp/TeamCityApp.xcodeproj -scheme TeamCityApp -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.4' \
            -derivedDataPath build/kmp-phase-1/DerivedData \
            -resultBundlePath build/kmp-phase-1/ios-smoke.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO test
      - name: Upload simulator test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kmp-ios-tests
          path: |
            build/kmp-phase-1/ios-smoke.xcresult
            features/about/presentation/build/test-results
            features/about/presentation/build/reports/tests
