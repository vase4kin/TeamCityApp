name: CI

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Override changed + smoke with the selected UI suite
        type: boolean
        default: false
      suite:
        description: UI suite override (otherwise changed + smoke runs)
        type: choice
        default: full
        options: [full, smoke, single, random]
      test_name:
        description: 'Single suite: package.TestClass#testMethod'
        type: string
        default: ''
      random_seed:
        description: 'Random suite: optional seed to repeat a selection'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Cancel superseded PR validation, but preserve every manual/default-branch UI run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-policy:
    name: Test policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ui_tests: ${{ steps.policy.outputs.run_ui_tests }}
      suite: ${{ steps.policy.outputs.suite }}
      collect_coverage: ${{ steps.policy.outputs.collect_coverage }}
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Compare the complete PR branch or the push's before/after commits.
          fetch-depth: 0

      - name: Select UI test policy and suite
        id: policy
        run: python3 scripts/marathon-ci.py policy --selection-dir marathon-selection

      - name: Upload UI test selection
        if: steps.policy.outputs.run_ui_tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-selection
          path: marathon-selection
          if-no-files-found: error

  build:
    name: Build
    needs: test-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Same-repository PR reruns can reuse their compiled task outputs.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Build mock application
        if: needs.test-policy.outputs.run_ui_tests != 'true'
        run: ./gradlew :app:assembleMockDebug --stacktrace

      - name: Build mock application and instrumentation APK without coverage
        if: needs.test-policy.outputs.run_ui_tests == 'true' && needs.test-policy.outputs.collect_coverage != 'true'
        run: ./gradlew :app:assembleMockDebug :app:assembleMockDebugAndroidTest --stacktrace

      - name: Build mock application and instrumentation APK with coverage
        if: needs.test-policy.outputs.run_ui_tests == 'true' && needs.test-policy.outputs.collect_coverage == 'true'
        run: |
          ./gradlew -PinstrumentationCoverage :app:assembleMockDebug :app:assembleMockDebugAndroidTest :app:prepareInstrumentationCoverageInputs --stacktrace

      - name: Upload mock test APKs
        if: needs.test-policy.outputs.run_ui_tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mock-test-apks
          path: app/build/outputs/apk
          if-no-files-found: error

      - name: Upload instrumentation coverage inputs
        if: needs.test-policy.outputs.collect_coverage == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-coverage-inputs
          path: app/build/coverage/instrumentation-inputs/instrumentation-coverage-inputs.zip
          if-no-files-found: error

  build-minified:
    name: Build minified
    needs: test-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Same-repository PR reruns can reuse their compiled task outputs.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Prepare R8 verification configuration
        run: python3 scripts/prepare-r8-verification.py

      - name: Build minified application
        if: needs.test-policy.outputs.suite != 'full'
        run: ./gradlew -Pr8Verification :app:assembleProdR8Verification --stacktrace

      - name: Build minified application and R8 smoke-test APK
        if: needs.test-policy.outputs.suite == 'full'
        run: ./gradlew -Pr8Verification :app:assembleProdR8Verification :app:assembleProdR8VerificationAndroidTest --stacktrace

      - name: Upload R8 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-diagnostics
          path: app/build/outputs/mapping/prodR8Verification
          if-no-files-found: warn

      - name: Upload R8 test APKs
        if: needs.test-policy.outputs.suite == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: r8-test-apks
          path: app/build/outputs/apk
          if-no-files-found: error

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Same-repository PR reruns can reuse their compiled task outputs.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Run checks
        run: ./gradlew lintMockDebug --stacktrace

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: app/build/reports/lint-report
          if-no-files-found: warn

  unit-tests:
    name: Unit tests
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Same-repository PR reruns can reuse their compiled task outputs.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Run unit tests and generate coverage
        run: |
          python3 -m unittest discover -s scripts/tests
          ./gradlew :build-logic:test testMockDebugUnitTest testDebugUnitTest :app:generateCodeCoverageReport --stacktrace

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            app/build/coverage/generateCodeCoverageReport/generateCodeCoverageReport.xml
            build/coverage-report
          if-no-files-found: warn

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: app/build/coverage/generateCodeCoverageReport/generateCodeCoverageReport.xml
          disable_search: true
          flags: unit
          name: unit
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true
          use_oidc: true

  marathon-tests:
    name: Marathon Cloud (${{ matrix.label }})
    permissions:
      contents: read
      id-token: write
    needs: [test-policy, build, build-minified]
    if: needs.test-policy.outputs.run_ui_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-policy.outputs.matrix) }}
    env:
      MARATHON_OS_VERSION: "17"
      MARATHON_LABEL: ${{ matrix.label }}
      MARATHON_SUITE: ${{ needs.test-policy.outputs.suite }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download UI test selection
        uses: actions/download-artifact@v7
        with:
          name: ui-test-selection
          path: marathon-selection

      - name: Download test APKs
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: app/build/outputs/apk

      - name: Verify Marathon Cloud API token
        env:
          MARATHON_CLOUD_API_TOKEN: ${{ secrets.MARATHON_CLOUD_API_TOKEN }}
        run: |
          if [[ -z "$MARATHON_CLOUD_API_TOKEN" ]]; then
            echo "MARATHON_CLOUD_API_TOKEN secret is required." >&2
            exit 1
          fi

      - name: Set up Marathon Cloud CLI
        uses: MarathonLabs/setup-marathon-cloud@2.0.1
        with:
          version: "1.0.64"

      - name: Run tests with Marathon Cloud
        env:
          MARATHON_CLOUD_API_KEY: ${{ secrets.MARATHON_CLOUD_API_TOKEN }}
          MARATHON_APPLICATION: ${{ matrix.application }}
          MARATHON_TEST_APPLICATION: ${{ matrix.test-application }}
          MARATHON_COVERAGE: ${{ matrix.coverage }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          filter_args=()
          if [[ "$MARATHON_LABEL" == "instrumentation" && "$MARATHON_SUITE" != "full" ]]; then
            filter_args=(--filter-file marathon-selection/filter.yaml)
          fi
          marathon-cloud run android \
            "${filter_args[@]}" \
            --application "$MARATHON_APPLICATION" \
            --test-application "$MARATHON_TEST_APPLICATION" \
            --device phone --os-version "$MARATHON_OS_VERSION" --system-image google_apis \
            --wait true --code-coverage "$MARATHON_COVERAGE" --no-progress-bars \
            --output "app/build/github-actions/marathon/$MARATHON_LABEL" \
            --branch "$HEAD_BRANCH" \
            --link "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --name "TeamCityApp $MARATHON_LABEL at ${{ github.sha }}"

      - name: Verify selected tests ran successfully
        run: |
          python3 scripts/marathon-ci.py verify \
            --results "app/build/github-actions/marathon/$MARATHON_LABEL" \
            --selection marathon-selection/selection.json --label "$MARATHON_LABEL"

      - name: Set up Java for coverage
        if: matrix.coverage
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Download instrumentation coverage inputs
        if: matrix.coverage
        uses: actions/download-artifact@v7
        with:
          name: instrumentation-coverage-inputs
          path: instrumentation-coverage-input

      - name: Generate instrumentation coverage report
        if: matrix.coverage
        run: |
          unzip -q instrumentation-coverage-input/instrumentation-coverage-inputs.zip -d instrumentation-coverage-input
          python3 scripts/generate-instrumentation-coverage.py \
            --inputs instrumentation-coverage-input \
            --execution-data "app/build/github-actions/marathon/$MARATHON_LABEL" \
            --output "app/build/coverage/instrumentation/$MARATHON_LABEL.xml"

      - name: Upload instrumentation coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-coverage
          path: app/build/coverage/instrumentation/${{ matrix.label }}.xml
          if-no-files-found: error

      - name: Upload instrumentation coverage to Codecov
        # Sampled runs must not replace the full-suite carryforward baseline.
        if: matrix.coverage && needs.test-policy.outputs.suite == 'full'
        uses: codecov/codecov-action@v7
        with:
          files: app/build/coverage/instrumentation/${{ matrix.label }}.xml
          disable_search: true
          flags: instrumentation
          name: instrumentation
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload Marathon Cloud artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-cloud-${{ matrix.label }}
          path: app/build/github-actions/marathon/${{ matrix.label }}
          if-no-files-found: warn
