name: CI

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tests:
    name: Build test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Build application and test APKs
        run: ./gradlew assembleMockDebug assembleMockDebugAndroidTest assembleMockDebugUnitTest --stacktrace

      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: test-apks
          path: app/build/outputs/apk
          if-no-files-found: error

  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Run static checks
        run: ./gradlew lintMockDebug --stacktrace

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: app/build/reports/lint-report
          if-no-files-found: warn

  unit-tests:
    name: Unit tests
    needs: build-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Run unit tests
        run: ./gradlew testMockDebugUnitTest testDebugUnitTest --stacktrace

      - name: Archive unit-test coverage data
        if: always()
        run: |
          # JaCoCo needs compiled classes as well as execution data on the coverage runner.
          find . -type f \( \
            -path '*/build/jacoco/*.exec' -o \
            -path '*/build/intermediates/javac/*/*.class' -o \
            -path '*/build/tmp/kotlin-classes/*/*.class' \
          \) -print > unit-test-coverage-files.txt
          tar -czf unit-test-coverage.tar.gz --files-from unit-test-coverage-files.txt

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn

      - name: Upload unit-test coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: unit-test-coverage.tar.gz
          if-no-files-found: error

  marathon-tests:
    name: Marathon Cloud (${{ matrix.label }})
    needs: build-tests
    # Paused by default; set the repository variable ENABLE_MARATHON_TESTS to 'true' to resume.
    if: >-
      ${{
        vars.ENABLE_MARATHON_TESTS == 'true' &&
        !startsWith(github.head_ref || github.ref_name, 'chore-') &&
        (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-14
            os-version: "14"
            release-only: false
          - label: android-13
            os-version: "13"
            release-only: false
          - label: android-12
            os-version: "12"
            release-only: true
          - label: android-11
            os-version: "11"
            release-only: true
          - label: android-10
            os-version: "10"
            release-only: true
    env:
      RUN_MARATHON_TEST: >-
        ${{ matrix.release-only == false || startsWith(github.head_ref || github.ref_name, 'release-') }}

    steps:
      - name: Check out repository
        if: env.RUN_MARATHON_TEST == 'true'
        uses: actions/checkout@v7

      - name: Download test APKs
        if: env.RUN_MARATHON_TEST == 'true'
        uses: actions/download-artifact@v7
        with:
          name: test-apks
          path: app/build/outputs/apk

      - name: Verify Marathon Cloud API token
        if: env.RUN_MARATHON_TEST == 'true'
        env:
          MARATHON_CLOUD_API_TOKEN: ${{ secrets.MARATHON_CLOUD_API_TOKEN }}
        run: |
          if [[ -z "$MARATHON_CLOUD_API_TOKEN" ]]; then
            echo "MARATHON_CLOUD_API_TOKEN secret is required." >&2
            exit 1
          fi

      - name: Run instrumentation tests with Marathon Cloud
        if: env.RUN_MARATHON_TEST == 'true'
        uses: MarathonLabs/action-test@1.0.14
        with:
          apiKey: ${{ secrets.MARATHON_CLOUD_API_TOKEN }}
          version: "1.0.64"
          application: app/build/outputs/apk/mock/debug/app-mock-debug.apk
          testApplication: app/build/outputs/apk/androidTest/mock/debug/app-mock-debug-androidTest.apk
          platform: android
          device: phone
          osVersion: ${{ matrix.os-version }}
          systemImage: google_apis
          wait: true
          output: app/build/github-actions/marathon/${{ matrix.label }}
          branch: ${{ github.head_ref || github.ref_name }}
          link: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          name: TeamCityApp ${{ matrix.label }} at ${{ github.sha }}

      - name: Upload Marathon Cloud artifacts
        if: env.RUN_MARATHON_TEST == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-cloud-${{ matrix.label }}
          path: app/build/github-actions/marathon/${{ matrix.label }}
          if-no-files-found: warn

  coverage:
    name: Coverage
    needs:
      - unit-tests
      - marathon-tests
    if: >-
      ${{
        !cancelled() &&
        needs.unit-tests.result == 'success' &&
        (needs.marathon-tests.result == 'success' || needs.marathon-tests.result == 'skipped') &&
        !startsWith(github.head_ref || github.ref_name, 'chore-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Download unit-test coverage data
        uses: actions/download-artifact@v7
        with:
          name: unit-test-coverage
          path: coverage-input/unit

      - name: Restore coverage data
        run: tar -xzf coverage-input/unit/unit-test-coverage.tar.gz

      - name: Generate coverage report
        run: ./gradlew :app:generateCodeCoverageReport --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            app/build/coverage/generateCodeCoverageReport/generateCodeCoverageReport.xml
            build/coverage-report
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: app/build/coverage/generateCodeCoverageReport/generateCodeCoverageReport.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
