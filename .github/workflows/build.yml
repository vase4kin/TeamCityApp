name: CI

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep APK preparation and execution behind the same instrumentation policy.
env:
  RUN_MARATHON_TESTS: >-
    ${{
      vars.ENABLE_MARATHON_TESTS == 'true' &&
      !startsWith(github.head_ref || github.ref_name, 'chore-') &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      marathon-enabled: ${{ steps.test-policy.outputs.marathon-enabled }}

    steps:
      - name: Resolve instrumentation policy
        id: test-policy
        run: echo "marathon-enabled=$RUN_MARATHON_TESTS" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Same-repository PR reruns can reuse their compiled task outputs.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Build mock application and optional instrumentation APK
        run: |
          tasks=(:app:assembleMockDebug)
          if [[ "$RUN_MARATHON_TESTS" == 'true' ]]; then
            tasks=(-PinstrumentationCoverage "${tasks[@]}" :app:assembleMockDebugAndroidTest :app:prepareInstrumentationCoverageInputs)
          fi
          ./gradlew "${tasks[@]}" --stacktrace

      - name: Upload mock test APKs
        if: env.RUN_MARATHON_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mock-test-apks
          path: app/build/outputs/apk
          if-no-files-found: error

      - name: Upload instrumentation coverage inputs
        if: env.RUN_MARATHON_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-coverage-inputs
          path: app/build/coverage/instrumentation-inputs/instrumentation-coverage-inputs.zip
          if-no-files-found: error

  build-minified:
    name: Build minified
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Same-repository PR reruns can reuse their compiled task outputs.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Build minified application and optional R8 smoke-test APK
        run: |
          python3 scripts/prepare-r8-verification.py
          tasks=(:app:assembleProdR8Verification)
          if [[ "$RUN_MARATHON_TESTS" == 'true' ]]; then
            tasks+=(:app:assembleProdR8VerificationAndroidTest)
          fi
          ./gradlew -Pr8Verification "${tasks[@]}" --stacktrace

      - name: Upload R8 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-diagnostics
          path: app/build/outputs/mapping/prodR8Verification
          if-no-files-found: warn

      - name: Upload R8 test APKs
        if: env.RUN_MARATHON_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: r8-test-apks
          path: app/build/outputs/apk
          if-no-files-found: error

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Same-repository PR reruns can reuse their compiled task outputs.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Run checks
        run: ./gradlew lintMockDebug --stacktrace

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: app/build/reports/lint-report
          if-no-files-found: warn

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Same-repository PR reruns can reuse their compiled task outputs.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Copy mock Google services configuration
        run: |
          mkdir -p app/src/mock/debug app/src/prod/debug
          cp mock-mockDebug-google-services.json app/src/mock/debug/google-services.json
          cp mock-prodDebug-google-services.json app/src/prod/debug/google-services.json

      - name: Run unit tests and generate coverage
        run: |
          python3 -m unittest discover -s scripts/tests
          ./gradlew :build-logic:test testMockDebugUnitTest testDebugUnitTest :app:generateCodeCoverageReport --stacktrace

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            app/build/coverage/generateCodeCoverageReport/generateCodeCoverageReport.xml
            build/coverage-report
          if-no-files-found: warn

  marathon-tests:
    name: Marathon Cloud (${{ matrix.label }})
    permissions:
      contents: read
      id-token: write
    needs: [build, build-minified]
    # Paused by default; set ENABLE_MARATHON_TESTS to 'true' to build and run test APKs.
    if: needs.build.outputs.marathon-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-14
            os-version: "14"
            release-only: false
          - label: android-13
            os-version: "13"
            release-only: false
          - label: android-12
            os-version: "12"
            release-only: true
          - label: android-11
            os-version: "11"
            release-only: true
          - label: android-10
            os-version: "10"
            release-only: true
    env:
      RUN_MARATHON_TEST: >-
        ${{ matrix.release-only == false || startsWith(github.head_ref || github.ref_name, 'release-') }}

    steps:
      - name: Check out repository
        if: env.RUN_MARATHON_TEST == 'true'
        uses: actions/checkout@v7

      - name: Download mock test APKs
        if: env.RUN_MARATHON_TEST == 'true'
        uses: actions/download-artifact@v7
        with:
          name: mock-test-apks
          path: app/build/outputs/apk

      - name: Download R8 test APKs
        if: env.RUN_MARATHON_TEST == 'true' && matrix.label == 'android-14'
        uses: actions/download-artifact@v7
        with:
          name: r8-test-apks
          path: app/build/outputs/apk

      - name: Verify Marathon Cloud API token
        if: env.RUN_MARATHON_TEST == 'true'
        env:
          MARATHON_CLOUD_API_TOKEN: ${{ secrets.MARATHON_CLOUD_API_TOKEN }}
        run: |
          if [[ -z "$MARATHON_CLOUD_API_TOKEN" ]]; then
            echo "MARATHON_CLOUD_API_TOKEN secret is required." >&2
            exit 1
          fi

      - name: Set up Marathon Cloud CLI
        if: env.RUN_MARATHON_TEST == 'true'
        uses: MarathonLabs/setup-marathon-cloud@2.0.1
        with:
          version: "1.0.64"

      - name: Run instrumentation tests with Marathon Cloud
        if: env.RUN_MARATHON_TEST == 'true'
        env:
          MARATHON_CLOUD_API_KEY: ${{ secrets.MARATHON_CLOUD_API_TOKEN }}
          MARATHON_OS_VERSION: ${{ matrix.os-version }}
          MARATHON_LABEL: ${{ matrix.label }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          marathon-cloud run android \
            --application app/build/outputs/apk/mock/debug/app-mock-debug.apk \
            --test-application app/build/outputs/apk/androidTest/mock/debug/app-mock-debug-androidTest.apk \
            --device phone --os-version "$MARATHON_OS_VERSION" --system-image google_apis \
            --wait true --code-coverage true --no-progress-bars \
            --output "app/build/github-actions/marathon/$MARATHON_LABEL" \
            --branch "$HEAD_BRANCH" \
            --link "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --name "TeamCityApp $MARATHON_LABEL at ${{ github.sha }}"

      - name: Run minified R8 smoke tests with Marathon Cloud
        if: env.RUN_MARATHON_TEST == 'true' && matrix.label == 'android-14'
        uses: MarathonLabs/action-test@1.0.14
        with:
          apiKey: ${{ secrets.MARATHON_CLOUD_API_TOKEN }}
          version: "1.0.64"
          application: app/build/outputs/apk/prod/r8Verification/app-prod-r8Verification.apk
          testApplication: app/build/outputs/apk/androidTest/prod/r8Verification/app-prod-r8Verification-androidTest.apk
          platform: android
          device: phone
          osVersion: "14"
          systemImage: google_apis
          wait: true
          output: app/build/github-actions/marathon/r8
          branch: ${{ github.head_ref || github.ref_name }}
          link: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          name: TeamCityApp R8 smoke tests at ${{ github.sha }}

      - name: Upload R8 smoke-test artifacts
        if: env.RUN_MARATHON_TEST == 'true' && matrix.label == 'android-14' && always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-cloud-r8
          path: app/build/github-actions/marathon/r8
          if-no-files-found: warn

      - name: Set up Java for coverage
        if: env.RUN_MARATHON_TEST == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Download instrumentation coverage inputs
        if: env.RUN_MARATHON_TEST == 'true'
        uses: actions/download-artifact@v7
        with:
          name: instrumentation-coverage-inputs
          path: instrumentation-coverage-input

      - name: Generate instrumentation coverage report
        if: env.RUN_MARATHON_TEST == 'true'
        env:
          MARATHON_LABEL: ${{ matrix.label }}
        run: |
          unzip -q instrumentation-coverage-input/instrumentation-coverage-inputs.zip -d instrumentation-coverage-input
          python3 scripts/generate-instrumentation-coverage.py \
            --inputs instrumentation-coverage-input \
            --execution-data "app/build/github-actions/marathon/$MARATHON_LABEL" \
            --output "app/build/coverage/instrumentation/$MARATHON_LABEL.xml"

      - name: Upload instrumentation coverage report
        if: env.RUN_MARATHON_TEST == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-coverage-${{ matrix.label }}
          path: app/build/coverage/instrumentation/${{ matrix.label }}.xml
          if-no-files-found: error

      - name: Upload instrumentation coverage to Codecov
        if: env.RUN_MARATHON_TEST == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: app/build/coverage/instrumentation/${{ matrix.label }}.xml
          disable_search: true
          flags: instrumentation
          name: instrumentation-${{ matrix.label }}
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload Marathon Cloud artifacts
        if: env.RUN_MARATHON_TEST == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-cloud-${{ matrix.label }}
          path: app/build/github-actions/marathon/${{ matrix.label }}
          if-no-files-found: warn

  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write
    needs: unit-tests
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The unit-test runner generates the report using its existing classes and daemon.
      - name: Download coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage-input

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage-input/app/build/coverage/generateCodeCoverageReport/generateCodeCoverageReport.xml
          disable_search: true
          flags: unit
          name: unit
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true
          use_oidc: true
