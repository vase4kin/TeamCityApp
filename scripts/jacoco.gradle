apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.14"
}

tasks.withType(Test).configureEach {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

tasks.register('generateCodeCoverageReport', JacocoReport) {
    group = "code quality"

    description = "Generate Jacoco coverage reports"

    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file(
                "coverage/generateCodeCoverageReport/generateCodeCoverageReport.xml"
        )
        html.required = true
        html.outputLocation = rootProject.layout.buildDirectory.dir("coverage-report")
    }

    def javaClasses = []
    def kotlinClasses = []
    def javaSrc = []
    def kotlinSrc = []
    def execution = []

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BR.class',
            '**/BR$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            'android/**/*.*',
            '**/dagger/**'
    ]

    rootProject.subprojects.each { proj ->
        javaClasses   << fileTree(dir: "$proj.buildDir/intermediates/javac/debug", excludes: fileFilter)
        kotlinClasses << fileTree(dir: "$proj.buildDir/tmp/kotlin-classes/debug", excludes: fileFilter)
        javaClasses   << fileTree(dir: "$proj.buildDir/intermediates/javac/mockDebug", excludes: fileFilter)
        kotlinClasses << fileTree(dir: "$proj.buildDir/tmp/kotlin-classes/mockDebug", excludes: fileFilter)
        javaSrc       << "$proj.projectDir/src/main/java"
        kotlinSrc     << "$proj.projectDir/src/main/kotlin"
        execution     << fileTree(dir: proj.buildDir,
                includes: ['jacoco/*.exec',
                           'coverage.ec'])
    }

    getSourceDirectories().setFrom(files([javaSrc, kotlinSrc]))
    getClassDirectories().setFrom(files([javaClasses, kotlinClasses]))

    getExecutionData().setFrom(files(execution))

    doLast {
        print "file://${reports.html.outputLocation.get().asFile}/index.html"
    }
}
